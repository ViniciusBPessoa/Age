# Age — ambiente de desenvolvimento
# ARQUITETURA.md §11.1
#
# Subir:   make up
# Logs:    make logs
# Zerar:   make reset
name: age

x-health: &health
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

# Tudo que os dois serviços Python compartilham.
x-py-env: &py-env
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD obrigatório}@redis:6379/0
  MASTER_KEY: ${MASTER_KEY:?MASTER_KEY obrigatório}
  SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?SERVICE_JWT_SECRET obrigatório}
  ENVIRONMENT: development

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: age
      POSTGRES_USER: age_super
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatório}
      # Lidas pelo init-db.sh, que roda uma vez com o volume vazio.
      AGE_OWNER_PASSWORD: ${AGE_OWNER_PASSWORD:?}
      CORE_API_DB_PASSWORD: ${CORE_API_DB_PASSWORD:?}
      AI_WORKER_DB_PASSWORD: ${AI_WORKER_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./init-db.sql:/age/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U age_super -d age"]
      <<: *health
    ports:
      - "5432:5432" # só em dev, para inspecionar com psql/DBeaver

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD:?}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      <<: *health
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    # SEM ports: quem alcança o Redis injeta job arbitrário na fila
    # (ARQUITETURA.md §4.1.1).

  core-api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.core-api
      target: dev
    environment:
      <<: *py-env
      DATABASE_URL: postgresql+asyncpg://core_api:${CORE_API_DB_PASSWORD:?}@postgres:5432/age
      # Migrations rodam como age_owner, não como a role de runtime —
      # é o que mantém o RLS válido (§4.2.1).
      MIGRATION_DATABASE_URL: postgresql+asyncpg://age_owner:${AGE_OWNER_PASSWORD:?}@postgres:5432/age
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY obrigatório}
      AI_WORKER_INTERNAL_URL: http://ai-worker-api:8001
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      DB_SCHEMA_OWN: core
      DB_SCHEMA_READ: ai
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      <<: *health
    ports:
      - "8000:8000" # dev: acesso ao /docs. Em produção não publica.
    volumes:
      - ../services/core-api:/app:cached
      - ../packages/age-contracts:/packages/age-contracts:cached

  # Consumidor da fila. Sem porta: só trabalha o que vem do Redis.
  ai-worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.ai-worker
      target: dev
    environment:
      <<: *py-env
      DATABASE_URL: postgresql+asyncpg://ai_worker:${AI_WORKER_DB_PASSWORD:?}@postgres:5432/age
      MIGRATION_DATABASE_URL: postgresql+asyncpg://age_owner:${AGE_OWNER_PASSWORD:?}@postgres:5432/age
      DB_SCHEMA_OWN: ai
      DB_SCHEMA_READ: core
      WORKER_CONCURRENCY: 4
      TURN_TIMEOUT_SECONDS: 300
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ../services/ai-worker:/app:cached
      - ../packages/age-contracts:/packages/age-contracts:cached

  # API interna do worker (cancelamento e readyz), mesma imagem.
  # Separada porque é outro processo: consumidor e HTTP não compartilham
  # ciclo de vida.
  ai-worker-api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.ai-worker
      target: dev
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    environment:
      <<: *py-env
      DATABASE_URL: postgresql+asyncpg://ai_worker:${AI_WORKER_DB_PASSWORD:?}@postgres:5432/age
      DB_SCHEMA_OWN: ai
      DB_SCHEMA_READ: core
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      <<: *health
    volumes:
      - ../services/ai-worker:/app:cached
      - ../packages/age-contracts:/packages/age-contracts:cached
    # SEM ports: fora do ingress, só rede interna (§7.3).

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      target: dev
    environment:
      # Nome de serviço, não localhost: o BFF roda no servidor do Next e
      # resolve pela rede do Compose. O browser nunca alcança o core-api.
      CORE_API_URL: http://core-api:8000
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      core-api: { condition: service_healthy }
    ports:
      - "3000:3000"
    volumes:
      - ../services/web:/app:cached
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
  redisdata:
