[project]
name = "age-contracts"
version = "0.1.0"
description = "Contratos compartilhados entre core-api e ai-worker"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/age_contracts"]
