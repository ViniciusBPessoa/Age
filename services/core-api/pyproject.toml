[project]
name = "age-core-api"
version = "0.1.0"
description = "Age — API de auth, conversas, planos e agenda"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "arq>=0.26",
    "sse-starlette>=2.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "cryptography>=44.0",
    "email-validator>=2.2",
    # RRULE (RFC 5545) para rotinas recorrentes (§5.9.4). Escrever um
    # expansor próprio seria um mau negócio: a especificação tem casos
    # de borda reais (BYSETPOS, horário de verão na virada, UNTIL vs.
    # COUNT) e errar neles põe a academia de alguém no dia errado.
    "python-dateutil>=2.9",
    # Upload de anexo: o FastAPI exige para `UploadFile`/`Form`.
    "python-multipart>=0.0.18",
    # Extrair o texto de PDF anexado. O modelo NAO aceita PDF (so
    # imagem), entao o texto e extraido aqui e enviado como texto.
    #
    # `pypdf` e puro Python: sem binario do sistema, sem compilacao, e
    # nao executa nada do documento. Alternativas (pdfminer, PyMuPDF)
    # trazem dependencia nativa ou licenca AGPL -- caro demais para o
    # que e, no fundo, ler strings de um formato.
    "pypdf>=5.1",
    "age-contracts",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "hypothesis>=6.120",
]

[tool.uv.sources]
age-contracts = { path = "../../packages/age-contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008: `Query()`/`Depends()` em argumento default e o padrao do
# FastAPI, nao um bug. Lutar contra o framework aqui nao paga.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
